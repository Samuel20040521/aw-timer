name: CI

# The same checks run locally with scripts/ci/local.sh; run that before
# pushing. Documentation-only changes skip CI.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "assets/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "assets/**", "LICENSE"]
  workflow_dispatch:

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One macOS job for everything that needs macOS, so the runner starts
  # once and the build cache is shared between the steps.
  macos:
    runs-on: macos-15
    env:
      # Oldest macOS the binary may run on (see README "Requirements").
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, MSRV, both macOS targets)
        run: |
          msrv="$(awk -F'"' '/^rust-version/ {print $2}' Cargo.toml)"
          echo "MSRV=${msrv}" >> "$GITHUB_ENV"
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustup toolchain install "${msrv}" --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Clippy
        run: cargo clippy --release -- -D warnings

      - name: Minimum supported Rust version
        run: cargo "+${MSRV}" check

      - name: Universal build for macOS 11
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output aw-timer \
            target/aarch64-apple-darwin/release/aw-timer \
            target/x86_64-apple-darwin/release/aw-timer
          codesign --force --sign - aw-timer

      - name: Binary checks
        run: scripts/ci/check-binary.sh aw-timer

      - name: App bundle checks
        run: scripts/ci/check-bundle.sh aw-timer

  # Linting needs no macOS; Ubuntu runners start faster.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell scripts
        run: scripts/ci/check-shell.sh

      - name: Workflow files
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
