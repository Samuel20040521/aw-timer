name: Release

# Push a tag like v0.1.0 to publish a release; run manually to get the
# archive as a workflow artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    env:
      # Oldest macOS the binary may run on (see README "Requirements").
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      PKG: aw-timer-macos-universal
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (both macOS targets)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Test
        run: cargo test --release

      - name: Build arm64 and x86_64
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Universal binary + checks
        run: |
          mkdir "$PKG"
          lipo -create -output "$PKG/aw-timer" \
            target/aarch64-apple-darwin/release/aw-timer \
            target/x86_64-apple-darwin/release/aw-timer
          # Ad-hoc signature (no Developer ID); required to run on Apple Silicon.
          codesign --force --sign - "$PKG/aw-timer"
          lipo -info "$PKG/aw-timer"
          # Fail if the deployment target drifted or a newer-than-11.0 CoreAudio
          # symbol became a strong import again (see build.rs).
          otool -l "$PKG/aw-timer" | grep -A3 LC_BUILD_VERSION | grep -q "minos 11.0"
          if nm -m "$PKG/aw-timer" | grep "ProcessTap" | grep -qv "weak external"; then
            echo "::error::CoreAudio ProcessTap symbols are strongly linked (macOS 14.2+ only)"; exit 1
          fi
          "$PKG/aw-timer" --help > /dev/null

      - name: Package
        run: |
          cp install.sh uninstall.sh default_config.toml README.md README.zh-TW.md LICENSE "$PKG/"
          tar czf "$PKG.tar.gz" "$PKG"
          shasum -a 256 "$PKG.tar.gz" > "$PKG.tar.gz.sha256"
          cat "$PKG.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: |
            ${{ env.PKG }}.tar.gz
            ${{ env.PKG }}.tar.gz.sha256

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$PKG.tar.gz" "$PKG.tar.gz.sha256" \
            --title "aw-timer $GITHUB_REF_NAME" --generate-notes
