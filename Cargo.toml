[package]
name = "aw-timer"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Samuel20040521/aw-timer"
readme = "README.md"
description = "Rize-style focus timer on top of ActivityWatch"

[dependencies]
block2 = "0.6"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-event-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "EKCalendar", "EKCalendarItem", "EKEvent", "EKEventStore", "EKObject", "EKSource", "EKTypes"] }
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"
regex = "1.13.1"
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "aac"] }
toml = "1.1.8"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
unicode-width = "0.2.3"
# Plain HTTP to localhost only: no TLS stack needed.
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
